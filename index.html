<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvellous Profile-Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<article data-testid="test-profile-card">
  <figure>
    <img src="Profile image.png" alt="Profile photo of Marvellous Majaroola"  data-testid="test-user-avatar">
  </figure>
  <div class="profile-content">
    <header data-testid="test-user-name">Marvellous Majaroola</header>
    <p data-testid="test-user-bio">Frontend Developer, passionate about accessibility and design systems.</p>

    <p class="time-row">
      Current time:
      <span data-testid="test-user-time"></span>
    </p>

    <nav data-testid="test-user-social-links" aria-label="Social Links">
      <ul>
        <li><a data-testid="test-user-social-twitter" href="https://twitter.com/majaroola?t=MVzP9LjoTFy1TeZeTOVCHg&s=09" target="_blank" rel="noopener noreferrer">Twitter</a></li>
        <li><a data-testid="test-user-social-github" href="https://github.com/Marvel0111" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a data-testid="test-user-social-linkedin" href="https://linkedin.com/in/marvelous-majaroola" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      </ul>
    </nav>

    <div class="info-grid">
      <section>
        <h3>Hobbies</h3>
        <ul data-testid="test-user-hobbies">
          <li>Coding</li>
          <li>Cooking</li>
          <li>Traveling</li>
        </ul>
      </section>

      <section>
        <h3>Dislikes</h3>
        <ul data-testid="test-user-dislikes">
          <li>Procrastination</li>
          <li>Cluttered UI</li>
        </ul>
      </section>
    </div>
  </div>
</article>
<script src="index.js"></script>    
</body>
</html>
